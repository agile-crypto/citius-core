syntax = "proto3";

package caas.storage.v1;
option go_package = "github.com/agile-crypto/citius-core/store;store";

import "google/protobuf/timestamp.proto";
import "api/types/common.proto";

import "buf/validate/validate.proto";


enum KeyVersionStatus {
  KEY_VERSION_STATUS_UNSPECIFIED = 0;
  KEY_VERSION_STATUS_ACTIVE = 1;
  KEY_VERSION_STATUS_INACTIVE = 2;
  KEY_VERSION_STATUS_DESTROYED = 3;
}
// KeyVersion represents a version of a key with its material
message KeyVersion {
  // @gotags: gorm:"primary_key"
  string public_id = 1 [(buf.validate.field).string = {prefix: "ver_", min_len: 5}];
  // version number
  // @gotags: gorm:"not_null;uniqueIndex:key_version_idx"
  uint32 version = 2;
  // the public id of the key to which this version belongs
  // @gotags: gorm:"not_null,index;uniqueIndex:key_version_idx"
  string key_id = 3 [(buf.validate.field).string = {prefix: "key_", min_len: 5}];
  // @gotags: gorm:"default:current_timestamp"
  google.protobuf.Timestamp create_time = 4;
  // @gotags: gorm:"default:current_timestamp"
  google.protobuf.Timestamp update_time = 5;
  // ciphertext key material stored in the database
  // @gotags: gorm:"column:key_material;not_null" wrapping:"ct,key_material"
  bytes ct_key_material = 6;
  // plain text version of the decrypted key material
  // we are NOT storing this plain-text key material in the db
  // @gotags: gorm:"-" wrapping:"pt,key_material"
  bytes key_material = 7;
  // Template associated with the key material
  // @gotags: gorm:"not_null"
  string template_id = 8;
  // digest used for integrity checks
  // @gotags: gorm:"not_null"
  bytes digest = 9;
  // digest algorithm used to calculate the digest
  // @gotags: gorm:"not_null"
  string digest_algorithm = 10;
  // id of the key used to encrypt the key material
  // @gotags: gorm:"not_null"
  string wrapping_key_id = 11 [(buf.validate.field) = {ignore: IGNORE_IF_ZERO_VALUE, string: {prefix: "key_", min_len: 5}}];
  // id of the provider where the key lives
  // @gotags: gorm:"not_null"
  string provider_id = 12 [(buf.validate.field).string = {prefix: "prv_", min_len: 5}];
  // Lifecycle state of the key version
  // @gotags: gorm:"not_null"
  caas.crypto.v1.KeyLifecycleState state = 13;
  // Scope and filtering properties effective for this key version
  // @gotags: gorm:"not_null"
  bytes scope_specification = 14;
  // Whether this version's material may leave its provider in plaintext
  // (as a stored payload or an export). Once false for some material, it
  // stays false for every version that keeps that material.
  bool extractable = 15;
  // How this version's material came to be on its provider.
  KeyOrigin origin = 16;
  // Whether the material was generated in a FIPS 140 validated module and
  // has been held only by validated modules since. Once false for some
  // material, it stays false for every version that keeps that material.
  bool approved_lineage = 17;
}

// KeyOriginKind says whether a version's material is new or kept.
enum KeyOriginKind {
  KEY_ORIGIN_KIND_UNSPECIFIED = 0;
  // Generated by the version's provider.
  KEY_ORIGIN_KIND_GENERATED = 1;
  // Kept from an earlier version on the same provider (a transform that
  // retains key bytes).
  KEY_ORIGIN_KIND_RETAINED = 2;
  // Brought from an earlier version on another provider (a migration that
  // moves material).
  KEY_ORIGIN_KIND_TRANSFERRED = 3;
}

// KeyTransferChannel is how material moved between providers.
enum KeyTransferChannel {
  KEY_TRANSFER_CHANNEL_UNSPECIFIED = 0;
  // The core copied the stored payload.
  KEY_TRANSFER_CHANNEL_STORED_PAYLOAD = 1;
  // The source exported the key in plaintext and the target imported it.
  KEY_TRANSFER_CHANNEL_PLAINTEXT = 2;
  // The source wrapped the key under a transport key of the target.
  KEY_TRANSFER_CHANNEL_WRAPPED = 3;
}

// KeyOrigin records where a version's material came from.
message KeyOrigin {
  KeyOriginKind kind = 1;
  // For RETAINED and TRANSFERRED: the version the material came from, and
  // the provider instance that held it.
  uint32 source_version = 2;
  string source_provider_id = 3;
  // For TRANSFERRED: how the material moved. For RETAINED it is
  // STORED_PAYLOAD.
  KeyTransferChannel channel = 4;
}

// Key represents a cryptographic key stored in the database
message Key {
  // @gotags: gorm:"primary_key"
  string public_id = 1 [(buf.validate.field).string = {prefix: "key_", min_len: 5}]; 
  // @gotags: gorm:"not_null"
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  // @gotags: gorm:"default:current_timestamp"
  google.protobuf.Timestamp create_time = 3;
  // @gotags: gorm:"default:current_timestamp"
  google.protobuf.Timestamp update_time = 4;
  // @gotags: gorm:"default:null"
  google.protobuf.Timestamp destroy_time = 5;
  // @gotags: gorm:"not_null"
  string primitive = 6;
  // @gotags: gorm:"not_null"
  string policy_id = 8 [(buf.validate.field).string = {prefix: "pol_", min_len: 5}];
  // id of the current version of the key
  // @gotags: gorm:"not_null"
  uint32 current_version = 9 [(buf.validate.field).uint32.gte = 1];
  // Labels associated with the key
  map<string, string> labels = 10;
  caas.crypto.v1.KeyLifecycleState state = 11;
}